.mrow{min-width:0;flex-wrap:wrap}

 function cashClose(){
  const today=new Date().toLocaleDateString('en-CA');
  const payments=invoices.flatMap(i=>(i.fee_payments||[]).map(p=>({p,student:i.students||{},invoice:i})));
  const day=payments.filter(x=>new Date(x.p.paid_at).toLocaleDateString('en-CA')===today);
  const method=x=>String(x||'').toLowerCase().trim();
  const expectedCash=day.filter(x=>method(x.p.payment_method)==='cash').reduce((a,x)=>a+Number(x.p.amount||0),0);
  const expectedUpi=day.filter(x=>method(x.p.payment_method)==='upi').reduce((a,x)=>a+Number(x.p.amount||0),0);
  const expectedBank=day.filter(x=>method(x.p.payment_method).includes('bank')).reduce((a,x)=>a+Number(x.p.amount||0),0);
  const refs={};payments.forEach(x=>{const r=String(x.p.payment_reference||'').trim().toLowerCase();if(r)(refs[r]||(refs[r]=[])).push(x)});
  const duplicates=Object.keys(refs).filter(r=>refs[r].length>1);
  const m=modal('<h3>Daily collection reconciliation</h3><p class=mu>Expected collections for '+today+'. Compare these totals with cash in hand and your UPI/bank statement.</p><div class=fee-grid><div class=cd><small class=mu>Recorded cash</small><h3>₹'+expectedCash.toLocaleString('en-IN')+'</h3></div><div class=cd><small class=mu>Recorded UPI</small><h3>₹'+expectedUpi.toLocaleString('en-IN')+'</h3></div><div class=cd><small class=mu>Recorded bank</small><h3>₹'+expectedBank.toLocaleString('en-IN')+'</h3></div></div><label>Cash physically counted (₹)<input id=closeCash type=number min=0 step=.01 value="'+expectedCash+'"></label><label>UPI statement total (₹)<input id=closeUpi type=number min=0 step=.01 value="'+expectedUpi+'"></label><label>Bank statement total (₹)<input id=closeBank type=number min=0 step=.01 value="'+expectedBank+'"></label><label>Closing note<input id=closeNote placeholder="Cash difference, pending bank settlement, etc."></label><p class=mu>Differences: <b id=closeDiff>Cash ₹0 · UPI ₹0 · Bank ₹0</b></p>'+(duplicates.length?'<div class=cd><b>Duplicate transaction references flagged</b>'+duplicates.map(r=>'<p class=fee-meta>'+r.replace(/[&<>"]/g,'')+' · '+refs[r].length+' records</p>').join('')+'</div>':'<p class=mu>No duplicate transaction references found in loaded records.</p>')+'<button class=pb id=closeSave>Save closing</button><button class=sb id=closeCancel>Cancel</button>',sty(P[v]));
  const calc=()=>{const vals=[['Cash',Number(m.querySelector('#closeCash').value||0)-expectedCash],['UPI',Number(m.querySelector('#closeUpi').value||0)-expectedUpi],['Bank',Number(m.querySelector('#closeBank').value||0)-expectedBank]];m.querySelector('#closeDiff').textContent=vals.map(([label,n])=>label+' '+(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})+(Math.abs(n)>.009?' ⚠':' ✓')).join(' · ')};
  ['#closeCash','#closeUpi','#closeBank'].forEach(s=>m.querySelector(s).oninput=calc);calc();
  m.querySelector('#closeCancel').onclick=()=>m.remove();
  m.querySelector('#closeSave').onclick=async()=>{const cash=Number(m.querySelector('#closeCash').value),upi=Number(m.querySelector('#closeUpi').value),bank=Number(m.querySelector('#closeBank').value);if([cash,upi,bank].some(n=>!Number.isFinite(n)||n<0)){toast('Enter valid non-negative closing totals');return}const {error}=await SB.from('cash_closings').insert({school_id:schoolId,business_date:today,cash_counted:cash,upi_counted:upi,bank_counted:bank,expected_cash:expectedCash,expected_upi:expectedUpi,expected_bank:expectedBank,notes:m.querySelector('#closeNote').value.trim(),created_by:uid});if(error){toast('Closing not saved: '+error.message);return}m.remove();toast('Daily closing saved'+([Math.abs(cash-expectedCash),Math.abs(upi-expectedUpi),Math.abs(bank-expectedBank)].some(n=>n>.009)?' · Differences flagged':' · All balanced'))};
 }

 async function importSheet(){
  if(!window.XLSX){toast('Spreadsheet reader is loading; try again shortly');return}
  const m=modal('<h3>Import Excel / CSV</h3><p class=mu>Choose a spreadsheet, map its own column names, preview the data, then confirm. If any row fails, the database transaction rolls back the whole import.</p><button class=sb id=feeTemplate>Download template CSV</button><input id=feeFile type=file accept=".xlsx,.xls,.csv"><div id=feeMapping></div><div id=feePreview class=fee-import-preview></div><button class=pb id=feeConfirm disabled>Confirm import</button><button class=sb id=feeCancel>Cancel</button>',sty(P[v]));
  let rawRows=[],headers=[],mappedRows=[];
  const fields=[
   {key:'admission',label:'Admission number',required:true,aliases:['admission_number','admission_no','admission','roll_no']},
   {key:'name',label:'Student name',required:true,aliases:['student_name','full_name','name','child_name']},
   {key:'class',label:'Class',required:true,aliases:['class','class_name','grade']},
   {key:'amount',label:'Fee amount',required:true,aliases:['fee_amount','total_fee','amount_due','fee','amount']},

  const escI=s=>String(s==null?'':s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  m.querySelector('#feeCancel').onclick=()=>m.remove();

  function readMap(){

   if(errors.length){m.querySelector('#feePreview').innerHTML='<p class=mu>'+errors.map(escI).join('<br>')+'</p>';m.querySelector('#feeConfirm').disabled=true;return}
   mappedRows=rawRows.map((r,i)=>{

   });
