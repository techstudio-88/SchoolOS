<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef4ff">
  <title>You're offline · SchoolOS</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#e4f4ff);color:#17233d;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    main{width:min(100%,440px);padding:36px;border:1px solid #dce6f5;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 24px 70px rgba(63,91,145,.12);text-align:center}
    .icon{width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:20px;background:#e9edff;color:#635bdb;font-size:30px}
    h1{margin:0;font-size:26px;letter-spacing:-.04em}p{color:#64748b;line-height:1.65;font-size:14px}
    button{margin-top:14px;border:0;border-radius:13px;padding:12px 20px;background:linear-gradient(110deg,#7558e8,#399ce8);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  </style>
</head>
<body><main><div class="icon" aria-hidden="true">⌁</div><h1>You're offline</h1><p>SchoolOS couldn't reach the server. Your school records are not shown from cache, so private information stays protected. Check your connection and try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
